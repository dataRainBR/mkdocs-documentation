
site_name: "Teste MkDocs"
site_description: "Tutorial de MkDocs: instalação, configuração e personalização"
docs_dir: docs

hooks:
  - hooks/redirects.py

repo_url: https://github.com/dataRainBR/mkdocs-documentation
repo_name: dataRainBR/mkdocs-documentation
edit_uri: edit/main/docs/

nav:
  - Início: index.md
  - Começar:
      - Instalação: instalacao.md
      - "Markdown e navegação": markdown-e-navegacao.md
      - Configuração: configuracao-yaml.md
      - "Identidade visual": personalizacao.md
  - Conteúdo:
      - "Exemplos de código": exemplos-codigo.md
      - Notebook: exemplos-notebook.md
      - Imagens: imagens-recursos-visuais.md
      - Diagramas: diagramas-arquitetura.md
  - Ferramentas:
      - Preview: playwright-preview.md
      - "Docker e linguagens": dockerfile-outras-linguagens.md
      - Extensões: extensoes-pymdownx.md
      - Plugins: outros-plugins.md
      - "Pacotes utilizados": pacotes-utilizados.md
      - Referências: referencias.md
  - GitHub:
      - Git: git.md
      - "GitHub Actions": github-actions.md
      - Integração: integracao-github.md
      - "CLI (`gh`)": github-cli.md

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/datarain-logo.ico
  font:
    text: Roboto
    code: Roboto Mono
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: "Ativar modo escuro"
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: "Ativar modo claro"
  features:
    - content.action.edit
    - content.action.view
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]              # resolve `teste` a partir da raiz do projeto
          options:
            show_source: true
            show_root_heading: true
            docstring_style: google
        typescript: {}
  - glightbox
  - git-revision-date-localized:
      fallback_to_build_date: true
      enable_creation_date: true
      enable_git_follow: false
      type: timeago
  - awesome-pages
  - macros:
      module_name: macros_mkdocs
  - minify:
      minify_html: true
  - exporter:
      formats:
        pdf:
          enabled: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.snippets:
      base_path: .
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.blocks.caption
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
  - abbr
  - def_list
  - footnotes
  - tables
  - pymdownx.mark
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.keys
  - pymdownx.critic
  - pymdownx.magiclink
  - pymdownx.smartsymbols
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css
