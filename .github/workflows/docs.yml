name: Build e publica a documentação

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js (necessário para o TypeDoc)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar TypeDoc
        run: npm install --global typedoc

      - name: Instalar o uv
        uses: astral-sh/setup-uv@v3

      - name: Instalar dependências Python
        run: uv sync

      - name: Instalar o Chromium do Playwright
        run: uv run playwright install --with-deps chromium

      - name: Gerar referências dos pacotes
        run: uv run python docs_preview.py --generate-references

      - name: Buildar a documentação
        run: uv run mkdocs build --strict

      - name: Gerar PDF completo para download
        run: >-
          uv run python examples/expotr_to_pdf.py
          --site-dir site
          --output site/assets/documentacao-local.pdf

      - name: Disponibilizar PDF nos artefatos da Action
        uses: actions/upload-artifact@v4
        with:
          name: documentacao-completa-pdf
          path: site/assets/documentacao-local.pdf
          if-no-files-found: error
          retention-days: 30

      - name: Publicar artefato do GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
